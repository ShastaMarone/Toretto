name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: toretto
          POSTGRES_PASSWORD: toretto
          POSTGRES_DB: toretto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toretto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://toretto:toretto@localhost:5432/toretto_test
      E2E_DATABASE_URL: postgres://toretto:toretto@localhost:5432/toretto_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - name: Apps Script files match the code
        run: |
          npm run build:apps-script
          if [ -n "$(git status --porcelain apps-script/build)" ]; then
            git status --short apps-script/build
            echo "::error::apps-script/build is out of date. Run npm run build:apps-script and commit the result."
            exit 1
          fi
      - name: Unit and integration tests
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end test
        run: npm run test:e2e
      - name: End-to-end test (Vercel build)
        run: npm run test:e2e:vercel
      - name: End-to-end test (Google Apps Script)
        run: npx playwright test -c apps-script/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7
