<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 112" role="img" aria-label="Toretto Scheduling">
  <defs>
    <linearGradient id="tile" x1="14" y1="8" x2="114" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8a6ff"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.78  0 0 0 0 0.49  0 0 0 0 1  0 0 0 0.55 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(0 0) scale(0.875)" filter="url(#glow)">
    <rect width="128" height="128" rx="30" fill="url(#tile)"/>
    <rect x="40" y="20" width="9" height="18" rx="4.5" fill="#fff"/>
    <rect x="79" y="20" width="9" height="18" rx="4.5" fill="#fff"/>
    <rect x="24" y="30" width="80" height="24" rx="8" fill="#fff"/>
    <rect x="50" y="60" width="28" height="14" rx="5" fill="#fff"/>
    <rect x="50" y="78" width="28" height="14" rx="5" fill="#fff" fill-opacity="0.8"/>
    <rect x="50" y="96" width="28" height="14" rx="5" fill="#fff" fill-opacity="0.6"/>
    <g stroke="#fff" stroke-linecap="round" stroke-width="5">
      <path d="M18 67h22" stroke-opacity="0.55"/>
      <path d="M26 85h14" stroke-opacity="0.38"/>
      <path d="M32 103h8" stroke-opacity="0.24"/>
    </g>
  </g>
  <text x="132" y="68" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Toretto</text>
  <text x="135" y="92" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5.2" fill="#c77dff">SCHEDULING</text>
</svg>
